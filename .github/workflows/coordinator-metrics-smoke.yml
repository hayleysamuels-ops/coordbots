name: coordinator-metrics smoke

# Runs the deployed-page smoke test automatically, because three failures
# reached the user in one day and in every case the unit suite was green —
# nothing was checking the page a browser actually receives, and the one
# thing that did check it only ran when someone remembered to run it.
#
# Railway has no "deploy finished" webhook into Actions, so this polls:
# it waits for the running deployment to serve the commit that triggered
# it, then runs the smoke test against production.

on:
  push:
    branches: [main]
    paths:
      - "coordinator-metrics/**"
      - ".github/workflows/coordinator-metrics-smoke.yml"
  # So a failure can be re-checked after a fix without an empty commit.
  workflow_dispatch:
  # Catches drift that no push caused: a sync that empties a client, an
  # Ashby key expiring, a volume that failed to mount.
  schedule:
    - cron: "0 13 * * 1-5"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the deployable commit is found by walking back
          # through it, which a shallow clone cannot do.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        working-directory: coordinator-metrics
        run: npm ci --omit=dev

      - name: Unit tests
        working-directory: coordinator-metrics
        run: npm test

      # An unset secret is an empty string, not an error, so without this
      # the run polls an empty URL for the full timeout and then fails
      # with a message about health checks that says nothing about the
      # actual cause.
      - name: Check the required secrets exist
        env:
          SMOKE_URL: ${{ secrets.COORDINATOR_METRICS_URL }}
          SMOKE_USER: ${{ secrets.COORDINATOR_METRICS_USER }}
          SMOKE_PASSWORD: ${{ secrets.COORDINATOR_METRICS_PASSWORD }}
        run: |
          missing=""
          [ -z "$SMOKE_URL" ] && missing="$missing COORDINATOR_METRICS_URL"
          [ -z "$SMOKE_USER" ] && missing="$missing COORDINATOR_METRICS_USER"
          [ -z "$SMOKE_PASSWORD" ] && missing="$missing COORDINATOR_METRICS_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secret(s):$missing" >&2
            echo "Add them under Settings > Secrets and variables > Actions." >&2
            exit 1
          fi
          echo "All three secrets are set."

      # Railway rebuilds on the same push that triggered this, so the old
      # version is still serving for the first minute or two.
      #
      # Waiting for /healthz to return 200 was not enough: it cannot tell
      # the new deployment from the old one still running, so a dropped
      # deploy webhook meant CI certified the previous build. That
      # happened — a committed fix sat undeployed overnight while every
      # check was green. This waits for the service to report the exact
      # commit under test.
      - name: Wait for THIS commit to be serving
        env:
          SMOKE_URL: ${{ secrets.COORDINATOR_METRICS_URL }}
          SMOKE_USER: ${{ secrets.COORDINATOR_METRICS_USER }}
          SMOKE_PASSWORD: ${{ secrets.COORDINATOR_METRICS_PASSWORD }}
        run: |
          # NOT github.sha. Railway only builds commits that touch
          # deployable files, so a docs- or CI-only push is correctly
          # never served and waiting for it would hang until timeout —
          # which is exactly what happened on this gate's first run.
          #
          # These path filters mirror coordinator-metrics/railway.json's
          # watchPatterns. Keep them in step.
          EXPECTED_COMMIT=$(git log -1 --format=%H -- \
            'coordinator-metrics' \
            ':(exclude)coordinator-metrics/*.md' \
            ':(exclude)coordinator-metrics/**/*.md')
          if [ -z "$EXPECTED_COMMIT" ]; then
            echo "Could not determine the deployable commit; falling back to ${GITHUB_SHA:0:8}."
            EXPECTED_COMMIT="$GITHUB_SHA"
          fi
          echo "EXPECTED_COMMIT=$EXPECTED_COMMIT" >> "$GITHUB_ENV"
          echo "Waiting for ${EXPECTED_COMMIT:0:8} to be live..."
          for i in $(seq 1 24); do
            served=$(curl -s --max-time 15 -u "${SMOKE_USER}:${SMOKE_PASSWORD}" "${SMOKE_URL}/api/config" \
              | python3 -c 'import sys,json;print(json.load(sys.stdin).get("commit") or "")' 2>/dev/null || true)
            if [ "$served" = "$EXPECTED_COMMIT" ]; then
              echo "live after $((i * 15))s"
              # Let the boot sync rebuild the metrics cache.
              sleep 20
              exit 0
            fi
            if [ -z "$served" ]; then
              echo "  ${i}: no commit reported yet (building, or the build does not expose one)"
            else
              echo "  ${i}: serving ${served:0:8}, waiting for ${EXPECTED_COMMIT:0:8}"
            fi
            sleep 15
          done
          echo "::error::${EXPECTED_COMMIT:0:8} never went live. The deploy may have been dropped — redeploy with 'railway redeploy --from-source'." >&2
          exit 1

      - name: Smoke test the deployed page
        working-directory: coordinator-metrics
        env:
          SMOKE_URL: ${{ secrets.COORDINATOR_METRICS_URL }}
          SMOKE_USER: ${{ secrets.COORDINATOR_METRICS_USER }}
          SMOKE_PASSWORD: ${{ secrets.COORDINATOR_METRICS_PASSWORD }}
        run: npm run smoke
