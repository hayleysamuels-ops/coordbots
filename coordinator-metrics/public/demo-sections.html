<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Section layout — three options</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Prototype only. Nothing here is wired into the real dashboard;
         it exists so the three interaction patterns can be compared on
         real data before one is built properly. */
      .picker { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 8px; }
      .picker button {
        appearance: none; border: 1px solid var(--border); background: var(--surface);
        font-family: var(--font-sans); font-size: 13px; font-weight: 600; color: var(--text-secondary);
        padding: 10px 16px; border-radius: var(--radius-control); cursor: pointer; text-align: left;
      }
      .picker button[aria-pressed="true"] { background: var(--ember); color: #fff; border-color: var(--ember); }
      .picker button small { display: block; font-weight: 400; font-size: 11px; opacity: .85; margin-top: 2px; }

      /* A — one at a time */
      .deck-stage { min-height: 62vh; }
      .deck-nav { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
      .deck-nav button {
        appearance: none; border: 1px solid var(--border); background: var(--surface);
        border-radius: var(--radius-control); padding: 8px 18px; cursor: pointer;
        font-family: var(--font-sans); font-weight: 600; font-size: 13px; color: var(--text-primary);
      }
      .deck-nav button[disabled] { opacity: .4; cursor: default; }
      .deck-dots { display: flex; gap: 6px; margin-left: auto; }
      .deck-dots i { width: 7px; height: 7px; border-radius: 999px; background: var(--border); display: block; }
      .deck-dots i.on { background: var(--ember); }

      /* B — scroll-snap */
      .snap { max-height: 72vh; overflow-y: auto; scroll-snap-type: y mandatory; border: 1px solid var(--border-subtle); border-radius: var(--radius-card); }
      .snap > section { scroll-snap-align: start; min-height: 70vh; padding: 24px; border-bottom: 1px solid var(--gridline); }

      /* C — accordion */
      .acc > section { border-bottom: 1px solid var(--gridline); }
      .acc h2 { cursor: pointer; padding: 14px 0; margin: 0; display: flex; justify-content: space-between; }
      .acc h2::after { content: "+"; color: var(--text-muted); font-family: var(--font-mono); }
      .acc section[data-open="true"] h2::after { content: "–"; }
      .acc .body { padding-bottom: 20px; }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-row">
        <h1>Section layout — three options</h1>
        <div class="topbar-meta" id="meta">loading January…</div>
      </div>
    </header>

    <main>
      <p class="section-note" style="max-width:80ch">
        The same five sections of the January tab, rendered three ways on real data. Pick whichever
        reads best and I'll build it properly. This page is a prototype and will be deleted.
      </p>

      <div class="picker" id="picker">
        <button type="button" data-mode="deck" aria-pressed="true">A — One at a time<small>Next / Back, arrow keys. Nothing else on screen.</small></button>
        <button type="button" data-mode="snap" aria-pressed="false">B — Scroll-snap<small>Normal scrolling that settles on one section.</small></button>
        <button type="button" data-mode="acc" aria-pressed="false">C — Accordion<small>All headings visible, one open at a time.</small></button>
      </div>

      <div id="stage"></div>
    </main>

    <script>
      const el = (t, a = {}, c = []) => {
        const n = document.createElement(t);
        for (const [k, v] of Object.entries(a)) {
          if (v == null || v === false) continue;
          if (k === "class") n.className = v;
          else if (k === "text") n.textContent = v;
          else if (k === "html") n.innerHTML = v;
          else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
          else n.setAttribute(k, v);
        }
        for (const x of [].concat(c)) if (x != null) n.appendChild(typeof x === "string" ? document.createTextNode(x) : x);
        return n;
      };
      const num = (v) => (v ?? 0).toLocaleString("en-US");

      const tile = (value, label, sub, hero) =>
        el("div", { class: "stat" + (hero ? " hero" : "") }, [
          el("div", { class: "stat-number", text: value }),
          el("div", { class: "stat-label", text: label }),
          sub ? el("div", { class: "stat-sub", text: sub }) : null,
        ]);

      let SECTIONS = [];
      let mode = "deck";
      let index = 0;

      function build(p) {
        const s = p.scopes.coordinated;
        const t = s.totals;
        const r = s.results.full.current;
        const sup = p.support;
        const roles = s.byRole.full.slice(0, 8);
        const areas = s.areasToWorkOn;

        return [
          {
            title: "Level of support",
            body: () =>
              el("div", {}, [
                el("p", { class: "section-note", text: "How much of this client's hiring Carrara carried." }),
                el("div", { class: "stat-grid" }, [
                  tile(sup.interviews.share + "%", "of interviews were ours",
                    num(sup.interviews.ours) + " of " + num(sup.interviews.all), true),
                  tile(sup.candidates.share + "%", "of candidates", num(sup.candidates.ours) + " of " + num(sup.candidates.all)),
                  tile(sup.roles.share + "%", "of roles", num(sup.roles.ours) + " of " + num(sup.roles.all)),
                ]),
              ]),
          },
          {
            title: "Results — how well it ran",
            body: () =>
              el("div", {}, [
                el("div", { class: "stat-grid" }, [
                  tile(r.bookingTurnaround.medianHours + "bh", "Booking turnaround (median)",
                    "90th percentile " + r.bookingTurnaround.p90Hours + "bh", true),
                  tile(r.shortNotice.share + "%", "Short-notice bookings",
                    num(r.shortNotice.count) + " of " + num(r.shortNotice.sample), true),
                  tile(r.stageGap.medianDays + "d", "Time between stages",
                    r.stageGap.slowest ? "slowest: " + r.stageGap.slowest.label : ""),
                  tile(r.cancellationWithoutRebook.share + "%", "Cancelled, never rebooked"),
                  tile(r.rescheduleRate.share + "%", "Reschedule rate"),
                ]),
                el("p", { class: "section-note", text: "Not comparable between clients. Not an individual performance measure." }),
              ]),
          },
          {
            title: "Volume — what we did",
            body: () =>
              el("div", { class: "stat-grid" }, [
                tile(num(t.events), "Interviews held"),
                tile(num(t.hours) + "h", "Interview hours"),
                tile(num(t.candidates), "Candidates scheduled"),
                tile(num(t.roles), "Roles supported"),
                tile(num(t.interviewerSlots), "Interviewer seats filled"),
                tile(num(t.bookedAhead), "Booked ahead"),
              ]),
          },
          {
            title: "By role",
            body: () =>
              el("div", { class: "table-wrap" }, [
                el("table", {}, [
                  el("thead", {}, [el("tr", {}, [el("th", { text: "Role" }), el("th", { class: "num", text: "Interviews" }), el("th", { class: "num", text: "Hours" })])]),
                  el("tbody", {}, roles.map((x) => el("tr", {}, [
                    el("td", { class: "lead", text: x.title }),
                    el("td", { class: "num", text: num(x.events) }),
                    el("td", { class: "num", text: num(x.hours) + "h" }),
                  ]))),
                ]),
              ]),
          },
          {
            title: "Areas to work on",
            body: () =>
              el("div", {}, [
                el("p", { class: "section-note", text: "Cancellations never rebooked, against this client's own average of " + areas.clientAverage + "%." }),
                el("div", { class: "table-wrap" }, [
                  el("table", {}, [
                    el("thead", {}, [el("tr", {}, [el("th", { text: "Role" }), el("th", { class: "num", text: "Never rebooked" }), el("th", { class: "num", text: "Share" })])]),
                    el("tbody", {}, areas.byRole.slice(0, 6).map((x) => el("tr", {}, [
                      el("td", { class: "lead", text: x.name }),
                      el("td", { class: "num", text: x.neverRebooked + " of " + x.total }),
                      el("td", { class: "num", text: x.share + "%" }),
                    ]))),
                  ]),
                ]),
              ]),
          },
        ];
      }

      function renderDeck() {
        const s = SECTIONS[index];
        return el("div", {}, [
          el("div", { class: "deck-stage" }, [
            el("p", { class: "eyebrow", text: `${index + 1} of ${SECTIONS.length}` }),
            el("h2", { text: s.title }),
            s.body(),
          ]),
          el("div", { class: "deck-nav" }, [
            el("button", { type: "button", text: "← Back", disabled: index === 0, onclick: () => { index--; paint(); } }),
            el("button", { type: "button", text: "Next →", disabled: index === SECTIONS.length - 1, onclick: () => { index++; paint(); } }),
            el("div", { class: "deck-dots" }, SECTIONS.map((_, i) => el("i", { class: i === index ? "on" : "" }))),
          ]),
        ]);
      }

      const renderSnap = () =>
        el("div", { class: "snap" }, SECTIONS.map((s) => el("section", {}, [el("h2", { text: s.title }), s.body()])));

      function renderAcc() {
        const wrap = el("div", { class: "acc" });
        SECTIONS.forEach((s, i) => {
          const body = el("div", { class: "body" }, [s.body()]);
          const sec = el("section", { "data-open": String(i === 0) }, [
            el("h2", { text: s.title, onclick: () => {
              const open = sec.getAttribute("data-open") === "true";
              wrap.querySelectorAll("section").forEach((x) => { x.setAttribute("data-open", "false"); x.querySelector(".body").hidden = true; });
              sec.setAttribute("data-open", String(!open));
              body.hidden = open;
            } }),
            body,
          ]);
          body.hidden = i !== 0;
          wrap.appendChild(sec);
        });
        return wrap;
      }

      function paint() {
        const stage = document.getElementById("stage");
        stage.replaceChildren(mode === "deck" ? renderDeck() : mode === "snap" ? renderSnap() : renderAcc());
        document.querySelectorAll("#picker button").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
      }

      document.getElementById("picker").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        mode = b.dataset.mode;
        index = 0;
        paint();
      });

      document.addEventListener("keydown", (e) => {
        if (mode !== "deck") return;
        if (e.key === "ArrowRight" && index < SECTIONS.length - 1) { index++; paint(); }
        if (e.key === "ArrowLeft" && index > 0) { index--; paint(); }
      });

      fetch("/api/client/january")
        .then((r) => r.json())
        .then((p) => {
          SECTIONS = build(p);
          document.getElementById("meta").textContent = "January · real data · prototype";
          paint();
        })
        .catch((err) => {
          document.getElementById("stage").replaceChildren(
            el("div", { class: "notice" }, [el("h3", { text: "Could not load January" }), el("p", { text: String(err) })])
          );
        });
    </script>
  </body>
</html>
